<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="SOLARA HEAT — a top-down open-city crime game. Rio Vega, driver-for-hire, runs five missions across Solara Bay, steals cars, and outruns the PD.">
<title>SOLARA HEAT — An open-city crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0e14; }
  #game {
    position: fixed; inset: 0; margin: auto;
    width: 100vw; height: 100vh; display: block;
    touch-action: none; cursor: crosshair;
    background: #0c0e14;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="SOLARA HEAT: Rio Vega drives, steals cars, and runs missions across Solara Bay"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
